<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 545 200" fill="none" role="img">
  <title>trama</title>
  <!-- hexágono idêntico ao de inst/www/marca.svg: a marca completa é o mesmo
       desenho com o wordmark ao lado, não um redesenho -->
  <path d="M86.5 3 170.5 51.5 170.5 148.5 86.5 197 2.5 148.5 2.5 51.5Z"
        stroke="currentColor" stroke-width="6"
        stroke-linejoin="round" />
  <!-- as ligações vêm antes dos nós para que os nós cubram as pontas do traço -->
  <g stroke-width="7" stroke-linecap="round">
    <path d="M34.5 75C34.5 95 86.5 92 86.5 111" stroke="#2f80ed" />
    <path d="M86.5 75 86.5 111" stroke="#27ae60" />
    <path d="M138.5 75C138.5 95 86.5 92 86.5 111" stroke="#9b51e0" />
    <path d="M86.5 137 86.5 153" stroke="#27ae60" />
  </g>
  <g>
    <rect x="21.5" y="49" width="26" height="26" rx="7" fill="#2f80ed" />
    <rect x="73.5" y="49" width="26" height="26" rx="7" fill="#27ae60" />
    <rect x="125.5" y="49" width="26" height="26" rx="7" fill="#9b51e0" />
    <rect x="73.5" y="111" width="26" height="26" rx="7" fill="#27ae60" />
    <rect x="73.5" y="153" width="26" height="26" rx="7" fill="#9b51e0" />
  </g>
  <!-- texto fica como <text>: o destino é o README no GitHub, que renderiza
       com a fonte do sistema; converter em curvas engordaria o arquivo sem
       ganho. x=255 deixa ~84 de folga (meia largura do hexágono) e a linha de
       base em 128 centra a mancha das minúsculas no meio do hexágono (y=100).
       A palavra mede ~267 de largura na fonte de sistema daqui; o viewBox vai
       até 545 para sobrar uma folga de ~6%, porque cada sistema resolve
       system-ui numa fonte de métrica diferente e o texto não pode cortar -->
  <text x="255" y="128"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="92" font-weight="400" letter-spacing="2"
        fill="currentColor">t<tspan fill="#2f80ed">r</tspan>ama</text>
</svg>
