<!-- Variante escura da marca completa: o par de logo.svg, escolhida pelo
     <picture> do README. Mesmo motivo do outro arquivo — servido por <img> o
     SVG não herda cor nenhuma, então cada tema precisa da sua cópia com a cor
     já fixa. Aqui traço e texto são o #e6edf3 do tema escuro do GitHub. As
     três cores dos nós e o `r` azul não mudam: são a identidade, e têm
     contraste nos dois fundos. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 545 200" fill="none" role="img" aria-labelledby="tituloMarca">
  <!-- aria-labelledby e não só o <title> filho: leitor de tela lê o <title>
       de um role="img" de forma irregular, a referência explícita é o que
       funciona nos três grandes -->
  <title id="tituloMarca">trama</title>
  <!-- hexágono idêntico ao de inst/www/marca.svg: a marca completa é o mesmo
       desenho com o wordmark ao lado, não um redesenho -->
  <path d="M86.5 3 170.5 51.5 170.5 148.5 86.5 197 2.5 148.5 2.5 51.5Z"
        stroke="#e6edf3" stroke-width="6"
        stroke-linejoin="round" />
  <!-- as ligações vêm antes dos nós para que os nós cubram as pontas do traço -->
  <g stroke-width="7" stroke-linecap="round">
    <path d="M34.5 75C34.5 95 86.5 92 86.5 111" stroke="#2f80ed" />
    <path d="M86.5 75 86.5 111" stroke="#27ae60" />
    <path d="M138.5 75C138.5 95 86.5 92 86.5 111" stroke="#9b51e0" />
    <path d="M86.5 137 86.5 153" stroke="#27ae60" />
  </g>
  <g>
    <rect x="21.5" y="49" width="26" height="26" rx="7" fill="#2f80ed" />
    <rect x="73.5" y="49" width="26" height="26" rx="7" fill="#27ae60" />
    <rect x="125.5" y="49" width="26" height="26" rx="7" fill="#9b51e0" />
    <rect x="73.5" y="111" width="26" height="26" rx="7" fill="#27ae60" />
    <rect x="73.5" y="153" width="26" height="26" rx="7" fill="#9b51e0" />
  </g>
  <!-- texto fica como <text>: converter em curvas engordaria o arquivo sem
       ganho. x=255 deixa ~84 de folga (meia largura do hexágono) e a linha de
       base em 128 centra a mancha das minúsculas no meio do hexágono (y=100).
       system-ui resolve para uma fonte de métrica diferente em cada sistema,
       então a largura natural varia; textLength=270 (medido aqui) com
       lengthAdjust="spacingAndGlyphs" força a palavra a terminar sempre em
       525, e o enquadramento deixa de depender de qual fonte o leitor tem —
       uma fonte mais larga aperta os glifos em vez de estourar o viewBox -->
  <text x="255" y="128" textLength="270" lengthAdjust="spacingAndGlyphs"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="92" font-weight="400" letter-spacing="2"
        fill="#e6edf3">t<tspan fill="#2f80ed">r</tspan>ama</text>
</svg>
