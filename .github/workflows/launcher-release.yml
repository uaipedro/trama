# DEPRECATED (2026-09-23): tools/launcher/ (Go+Wails) no longer receives
# releases — see tools/launcher/DEPRECATED.md. The current "click and it
# just works" installer is tools/installer/ (Trama-Setup.exe via Inno
# Setup on Windows, install.sh on Linux), built and E2E-tested by
# .github/workflows/installer.yml. Left as-is, not deleted or disabled,
# purely as a reference in case it's needed again.
#
# Trama Launcher — release build
#
# Builds the Go+Wails desktop launcher (tools/launcher/) for Windows and
# Linux (amd64) and publishes both binaries as assets on a GitHub Release.
# This workflow is scoped to the launcher only — it is independent of any
# future release process for the `trama` R package itself.
#
# To trigger a release:
#   git tag launcher-v0.1.0 && git push origin launcher-v0.1.0
#
# You can also run this workflow manually (workflow_dispatch) to test the
# build on both platforms without creating a real GitHub Release.
#
# Assinatura de código (Windows): pra parar de aparecer "Publicador
# desconhecido" no SmartScreen, inscreva o projeto no programa gratuito de
# assinatura pra open source da SignPath (signpath.io) e cadastre estes
# segredos no repo (Settings → Secrets and variables → Actions):
#   SIGNPATH_API_TOKEN, SIGNPATH_ORG_ID, SIGNPATH_PROJECT_SLUG,
#   SIGNPATH_SIGNING_POLICY_SLUG
# Sem eles, o passo de assinatura é pulado e o binário sai sem assinatura,
# exatamente como hoje — nada muda até esses segredos existirem.

name: Launcher Release

on:
  push:
    tags:
      - "launcher-v*"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: tools/launcher

env:
  GO_VERSION: "1.25.0"
  WAILS_VERSION: "v2.16.0"
  NODE_VERSION: "20"

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    env:
      # Preparado pra assinatura de código do binário Windows via SignPath
      # (programa gratuito de assinatura pra projetos open source,
      # signpath.io) — inerte até existirem os segredos SIGNPATH_* no repo.
      # Sem eles, o passo de assinatura é pulado e o binário sai sem
      # assinatura, igual a hoje. Ver "Sign Windows binary" abaixo.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            wails-bin: launcher.exe
            artifact: trama-launcher-windows-amd64.exe
            build-tags: ""
          - os: ubuntu-latest
            platform: linux/amd64
            wails-bin: launcher
            artifact: trama-launcher-linux-amd64.tar.gz
            # Ubuntu 24.04 (ubuntu-latest) only ships libwebkit2gtk-4.1-dev
            # (4.0 was dropped); Wails needs this build tag to link against
            # webkit2gtk-4.1 instead of its 4.0 default.
            build-tags: "-tags webkit2_41"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build launcher
        run: wails build -platform ${{ matrix.platform }} -clean ${{ matrix.build-tags }}

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            # Empacota em tar.gz (não sobe o binário cru): um download direto
            # do navegador não preserva o bit de execução, então um binário
            # ELF baixado puro aparece pro usuário como "não sei com o que
            # abrir isso". tar.gz preserva permissões Unix na extração, então
            # o binário já sai executável.
            mv "build/bin/${{ matrix.wails-bin }}" "build/bin/trama-launcher-linux-amd64"
            chmod +x "build/bin/trama-launcher-linux-amd64"
            tar -czf "dist/${{ matrix.artifact }}" -C build/bin trama-launcher-linux-amd64
          else
            mv "build/bin/${{ matrix.wails-bin }}" "dist/${{ matrix.artifact }}"
          fi

      - name: Upload unsigned Windows binary
        if: matrix.os == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.artifact }}
          path: tools/launcher/dist/${{ matrix.artifact }}

      # Assina o .exe via SignPath, só roda quando os segredos SIGNPATH_*
      # existirem no repo (ver comentário no env: do job). Até lá, este
      # passo (e o próximo) são pulados silenciosamente e o binário
      # publicado continua sem assinatura, exatamente como hoje.
      - name: Sign Windows binary (SignPath)
        if: matrix.os == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: tools/launcher/dist-signed

      - name: Usar binário assinado quando disponível
        if: matrix.os == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        shell: bash
        run: mv "dist-signed/${{ matrix.artifact }}" "dist/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: tools/launcher/dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/launcher-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/trama-launcher-windows-amd64.exe/trama-launcher-windows-amd64.exe
            artifacts/trama-launcher-linux-amd64.tar.gz/trama-launcher-linux-amd64.tar.gz
          body: |
            Automated release of the Trama Launcher (${{ github.ref_name }}).

            Downloads R portable at runtime; these binaries are the launcher only.

            **Linux:** baixe o `.tar.gz`, extraia (`tar -xzf trama-launcher-linux-amd64.tar.gz`
            ou "Extrair aqui" no gerenciador de arquivos) e abra o binário — já sai
            com permissão de execução.
          generate_release_notes: true
