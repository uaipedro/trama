<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 173 200" fill="none" role="img" aria-labelledby="tituloMarca">
  <!-- aria-labelledby e não só o <title> filho: leitor de tela lê o <title>
       de um role="img" de forma irregular, a referência explícita é o que
       funciona nos três grandes -->
  <title id="tituloMarca">trama</title>
  <!-- o hexágono é a única forma que segue o tema: currentColor o deixa
       legível no claro e no escuro sem precisar de duas versões do arquivo -->
  <path d="M86.5 3 170.5 51.5 170.5 148.5 86.5 197 2.5 148.5 2.5 51.5Z"
        stroke="currentColor" stroke-width="6"
        stroke-linejoin="round" />
  <!-- as ligações vêm antes dos nós para que os nós cubram as pontas do traço -->
  <g stroke-width="7" stroke-linecap="round">
    <path d="M34.5 75C34.5 95 86.5 92 86.5 111" stroke="#2f80ed" />
    <path d="M86.5 75 86.5 111" stroke="#27ae60" />
    <path d="M138.5 75C138.5 95 86.5 92 86.5 111" stroke="#9b51e0" />
    <path d="M86.5 137 86.5 153" stroke="#27ae60" />
  </g>
  <!-- a fileira de cima começa em y=49 e o nó de baixo termina em y=179:
       mais alto os cantos dos nós laterais esbarrariam nas diagonais de cima,
       mais baixo a ponta inferior do hexágono não teria respiro -->
  <g>
    <rect x="21.5" y="49" width="26" height="26" rx="7" fill="#2f80ed" />
    <rect x="73.5" y="49" width="26" height="26" rx="7" fill="#27ae60" />
    <rect x="125.5" y="49" width="26" height="26" rx="7" fill="#9b51e0" />
    <rect x="73.5" y="111" width="26" height="26" rx="7" fill="#27ae60" />
    <rect x="73.5" y="153" width="26" height="26" rx="7" fill="#9b51e0" />
  </g>
</svg>
