<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 173 200" fill="none" role="img">
  <title>trama</title>
  <!-- o hexágono é a única forma que segue o tema: currentColor o deixa
       legível no claro e no escuro sem precisar de duas versões do arquivo -->
  <path d="M86.5 3 170.5 51.5 170.5 148.5 86.5 197 2.5 148.5 2.5 51.5Z"
        stroke="currentColor" stroke-width="6"
        stroke-linejoin="round" />
  <!-- as ligações vêm antes dos nós para que os nós cubram as pontas do traço -->
  <g stroke-width="5" stroke-linecap="round">
    <path d="M46 82C46 105 86.5 95 86.5 118" stroke="#2f80ed" />
    <path d="M86.5 82 86.5 118" stroke="#27ae60" />
    <path d="M127 82C127 105 86.5 95 86.5 118" stroke="#9b51e0" />
    <path d="M86.5 138 86.5 162" stroke="#27ae60" />
  </g>
  <g>
    <rect x="36" y="62" width="20" height="20" rx="5" fill="#2f80ed" />
    <rect x="76.5" y="62" width="20" height="20" rx="5" fill="#27ae60" />
    <rect x="117" y="62" width="20" height="20" rx="5" fill="#9b51e0" />
    <rect x="76.5" y="118" width="20" height="20" rx="5" fill="#27ae60" />
    <rect x="76.5" y="162" width="20" height="20" rx="5" fill="#9b51e0" />
  </g>
</svg>
