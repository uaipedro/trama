<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-labelledby="tituloMarca">
  <!-- aria-labelledby e não só o <title> filho: leitor de tela lê o <title>
       de um role="img" de forma irregular, a referência explícita é o que
       funciona nos três grandes -->
  <title id="tituloMarca">trama</title>
  <!-- viewBox quadrado porque o uso é favicon (16–32 px), que é quadrado: o
       hexágono fica centrado e ocupa quase toda a altura, sem faixa vazia -->
  <!-- contorno mais fino que na marca cheia para a cor dos nós dominar sobre
       a moldura nessa escala -->
  <!-- cor fixa, e não `currentColor`: como favicon o SVG é documento isolado,
       não herda o `color` de ninguém, e `currentColor` cairia no preto inicial
       — invisível em barra de abas escura. O cinza é neutro de propósito: a
       marca é assinatura e é deliberadamente a mesma nos dois temas. -->
  <path d="M100 3 184 51.5 184 148.5 100 197 16 148.5 16 51.5Z"
        stroke="#6e7681" stroke-width="5"
        stroke-linejoin="round" />
  <!-- versão para 16–32 px: menos nós e traço mais grosso, porque nessa
       escala detalhe some e só sobra a silhueta -->
  <g stroke-width="11" stroke-linecap="round">
    <path d="M60 82C60 106 100 112 100 134" stroke="#2f80ed" />
    <path d="M140 82C140 106 100 112 100 134" stroke="#9b51e0" />
  </g>
  <!-- nós de 38 px = 19% do viewBox: renderizado a 32 px cada nó vira um
       bloco de ~6 px, ainda claramente colorido -->
  <g>
    <rect x="41" y="44" width="38" height="38" rx="10" fill="#2f80ed" />
    <rect x="121" y="44" width="38" height="38" rx="10" fill="#9b51e0" />
    <rect x="81" y="134" width="38" height="38" rx="10" fill="#27ae60" />
  </g>
</svg>
