# Gerado pelo trama.publicar. A tag vX.Y.Z dispara: confere o pacote,
# renderiza a página, cria a release com o pacote zipado e publica no Pages,
# mantendo as versões antigas em /vX.Y.Z/ e a mais nova em /ultimo/.
# Versões fixadas de propósito: a página publicada não muda porque uma ação
# ou o Quarto mudaram.
name: publicar

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}ultimo/
    steps:
      - name: Baixar o pacote
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Conferir checksums e RO-Crate
        run: python3 .github/trama/conferir.py

      - name: Instalar o Quarto
        uses: quarto-dev/quarto-actions/setup@v2.2.0
        with:
          version: 1.7.32

      - name: Instalar o R
        uses: r-lib/actions/setup-r@v2.14.0
        with:
          r-version: "4.6.0"
          use-public-rspm: true

      - name: Instalar knitr e rmarkdown
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown"))'

      - name: Renderizar a página
        run: |
          mkdir -p _build
          git archive HEAD | tar -x -C _build
          cd _build
          quarto render index.qmd

      - name: Criar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=zip -o "pacote-${GITHUB_REF_NAME}.zip" HEAD
          gh release create "$GITHUB_REF_NAME" "pacote-${GITHUB_REF_NAME}.zip" \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file .github/trama/notas.md

      - name: Acumular as páginas
        run: bash .github/trama/paginas.sh

      - name: Configurar o Pages
        uses: actions/configure-pages@v6.0.0

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

      - name: Publicar no Pages
        id: deploy
        uses: actions/deploy-pages@v5.0.1
